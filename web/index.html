<!DOCTYPE html>
<html lang="en" data-theme="paper">

    <meta charset="utf-8" />

    <meta name="color-scheme" content="light dark" />
    <title>World War Thor — War Cabinet</title>
    <link rel="stylesheet" href="/css/main.css" />

  <body>
    <a class="skip-link" href="#app">Skip to war room</a>
